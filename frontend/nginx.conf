server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's name server, asked again at least every 10 seconds: a recreated api container
    # gets a new address, and a name resolved once at startup would keep the old one (502).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # A variable makes nginx resolve `api` per request; with no path, the URI goes as sent.
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/index, /documents/...) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
