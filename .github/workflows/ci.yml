name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.1"
          args: "check ."
      - name: Check Python formatting
        run: ruff format --check .
      - name: Notebooks carry no outputs (AMMC content is not redistributed)
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          dirty = [str(p) for p in pathlib.Path(".").rglob("*.ipynb")
                   if any(c.get("outputs") or c.get("execution_count")
                          for c in json.loads(p.read_text())["cells"])]
          sys.exit(f"strip outputs from: {dirty}" if dirty else 0)
          PY

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.10.0-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # The embedding model and Docling's models, downloaded from Hugging Face on first use.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('backend/uv.lock') }}
      # The API image has the embedder but no Docling: run the API, store and embedder tests in
      # the same environment, so a dependency that only the ingest extra brings in fails here.
      - name: API, store and embedder tests (no ingest extra)
        run: |
          uv sync --locked --extra embed
          uv run pytest -m "not ingest"
      - name: Docling parser and ingest tests
        run: |
          uv sync --locked --extra ingest
          uv run pytest -m ingest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - name: The API client matches the API
        run: |
          (cd ../backend && uv run --locked python -m bloomberg_invest.entrypoints.api.openapi) > src/api/openapi.json
          npm run gen:api
          git diff --exit-code -- src/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # The one check the main branch requires: it passes only when every job above passed.
  verify:
    if: always()
    needs: [quality, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
