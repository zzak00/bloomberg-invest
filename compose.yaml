name: bloomberg-invest

services:
  neo4j:
    image: neo4j:2026.10.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build: { context: backend, target: api }
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      EMBEDDER: ${EMBEDDER:-qwen3-0.6b}
      # Who checks figures in CHECKS; checks are refused while it is empty.
      REVIEWER: ${REVIEWER:-}
    volumes:
      # The API only reads stored PDFs; the only thing it writes is rendered page images.
      - ./data/documents:/data/documents:ro
      - ./data/pages:/data/pages
      # The embedding model, shared with ingest: queries are embedded with the model Chunks were.
      - models:/root/.cache
    depends_on:
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      # The first start downloads the embedding model (about 1.2 GB) before the API answers.
      start_period: 10m

  web:
    build: frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: { condition: service_healthy }

  # Run on demand: docker compose run --rm ingest <pdf under data/> --issuer-isin ...
  ingest:
    profiles: ["tools"]
    build: { context: backend, target: ingest }
    # One image for ingest, chunk and embed, so a rebuild can't leave one of them on old code.
    image: bloomberg-invest-tools
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PARSER: ${PARSER:-docling}
      CHUNK_CAP: ${CHUNK_CAP:-2000}
      TABLE_CAP: ${TABLE_CAP:-1500}
      EMBEDDER: ${EMBEDDER:-qwen3-0.6b}
      # Azure OpenAI extracts figures and other facts; ingest stops before parsing without them.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      EXTRACT_DEPLOYMENT: ${EXTRACT_DEPLOYMENT:-gpt-5.6-sol}
      EXTRACT_CONCURRENCY: ${EXTRACT_CONCURRENCY:-4}
      LLM: ${LLM:-azure-openai}
      # tiktoken's encoding files, kept with Docling's models.
      TIKTOKEN_CACHE_DIR: /root/.cache/tiktoken
    volumes:
      - ./data:/data
      - models:/root/.cache
    depends_on:
      neo4j: { condition: service_healthy }

  # Re-chunk an ingested filing from its saved parse, then embed the new Chunks:
  # docker compose run --rm chunk <document id>
  chunk:
    extends: { service: ingest }
    entrypoint: ["bloomberg", "chunk"]

  # Re-embed an ingested filing's Chunks: docker compose run --rm embed <document id>
  embed:
    extends: { service: ingest }
    entrypoint: ["bloomberg", "embed"]

  # Re-extract an ingested filing's financial figures: docker compose run --rm extract <document id>
  extract:
    extends: { service: ingest }
    entrypoint: ["bloomberg", "extract"]

  # Re-extract an ingested filing's other facts (#24) and link their names:
  # docker compose run --rm facts <document id>
  facts:
    extends: { service: ingest }
    entrypoint: ["bloomberg", "facts"]

  # Daily closes (#26): `bloomberg prices daily` when it starts, then every day at 18:30
  # Casablanca time; each run catches up from the last stored session. Its log is the report:
  # docker compose logs prices. The other steps run on demand, with the same image:
  # docker compose run --rm prices backfill | import /data/prices/closes.csv | replay
  prices:
    build: { context: backend, target: api }
    entrypoint: ["bloomberg", "prices"]
    command: ["schedule", "--at", "18:30"]
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      # The raw answers kept from the Bourse, and CSVs to import.
      - ./data/prices:/data/prices
    depends_on:
      neo4j: { condition: service_healthy }

  # Throwaway database for the backend tests; its data lives in memory and goes with it.
  neo4j-test:
    profiles: ["test"]
    image: neo4j:2026.10.0-community
    environment:
      NEO4J_AUTH: neo4j/test-password
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "127.0.0.1:7688:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p test-password 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  neo4j-data:
  models:
