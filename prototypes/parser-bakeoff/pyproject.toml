[project]
name = "parser-bakeoff"
version = "0.1.0"
description = "Throwaway prototype for #10: score document parsers against the golden set."
requires-python = ">=3.12"
dependencies = [
    "azure-ai-documentintelligence>=1.0",
    "docling>=2.0",
]

[project.scripts]
bakeoff = "bakeoff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakeoff"]
